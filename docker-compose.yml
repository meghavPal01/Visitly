services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visitly
      POSTGRES_PASSWORD: visitly
      POSTGRES_DB: visitly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
