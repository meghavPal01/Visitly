# Render Blueprint: API + managed Postgres. Secrets are set in the Render dashboard, never here.
databases:
  - name: visitly-db
    plan: free
services:
  - type: web
    name: visitly-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: visitly-db, property: connectionString }
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false
